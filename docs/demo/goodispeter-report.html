<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNS Story</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --glass-bg: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.2);
    --glass-strong: rgba(255,255,255,0.18);
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.8);
    --text-muted: rgba(255,255,255,0.55);
    --accent-pink: #ff6b9d;
    --accent-cyan: #4ecdc4;
    --accent-yellow: #ffe66d;
    --accent-purple: #a78bfa;
  }

  body {
    background: #0f0f23;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    position: relative;
  }

  .back-link {
    position: relative;
    z-index: 100;
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.85rem;
    align-self: flex-start;
    margin-bottom: 16px;
    transition: color 0.3s;
  }
  .back-link:hover { color: #fff; }

  /* ── PHONE FRAME ── */
  .phone {
    position: relative;
    width: 390px;
    max-width: 96vw;
    aspect-ratio: 9 / 19;
    border-radius: 40px;
    overflow: hidden;
    box-shadow:
      0 0 0 2px rgba(255,255,255,0.1),
      0 0 0 6px #1a1a2e,
      0 0 0 8px rgba(255,255,255,0.05),
      0 20px 60px rgba(0,0,0,0.5),
      0 40px 100px rgba(0,0,0,0.3);
  }

  /* ── ANIMATED MESH GRADIENT ── */
  .gradient-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, #ff6b9d 0%, transparent 50%),
      radial-gradient(circle at 80% 30%, #4ecdc4 0%, transparent 45%),
      radial-gradient(circle at 40% 70%, #a78bfa 0%, transparent 50%),
      radial-gradient(circle at 75% 80%, #ffe66d 0%, transparent 40%),
      radial-gradient(circle at 10% 90%, #ff6b9d 0%, transparent 35%),
      linear-gradient(135deg, #1a0533 0%, #0d1b2a 30%, #1b2838 60%, #16213e 100%);
    background-size: 200% 200%;
    animation: meshMove 12s ease-in-out infinite;
  }

  @keyframes meshMove {
    0% { background-position: 0% 0%; }
    25% { background-position: 50% 25%; }
    50% { background-position: 100% 50%; }
    75% { background-position: 50% 75%; }
    100% { background-position: 0% 0%; }
  }

  /* Noise overlay for texture */
  .gradient-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  /* ── STATUS BAR ── */
  .status-bar {
    position: relative;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px 6px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .status-time {
    letter-spacing: 0.02em;
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── DYNAMIC ISLAND ── */
  .dynamic-island {
    position: relative;
    z-index: 20;
    width: 120px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    margin: 0 auto 8px;
  }

  /* ── PHOTO HERO ── */
  .photo-hero {
    position: relative;
    z-index: 10;
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
  }

  .photo-placeholder {
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at 30% 40%, rgba(255,107,157,0.15) 0%, transparent 50%),
      radial-gradient(circle at 70% 60%, rgba(78,205,196,0.12) 0%, transparent 50%),
      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%),
      linear-gradient(135deg, #1a1a3e 0%, #2d1b4e 50%, #1a2840 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Sora', sans-serif;
    font-size: 1.4rem;
    font-weight: 300;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.2em;
  }

  /* Gradient fade at bottom of photo */
  .photo-hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(to top, rgba(15,15,35,0.95) 0%, rgba(15,15,35,0.6) 40%, transparent 100%);
    pointer-events: none;
  }

  /* ── SUBJECT NAME OVERLAY ON PHOTO ── */
  .subject-name-overlay {
    position: absolute;
    bottom: 16px;
    left: 20px;
    z-index: 15;
  }

  .subject-label {
    font-family: 'Sora', sans-serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.1;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }

  .subject-type-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    padding: 4px 10px;
    border-radius: 20px;
    margin-top: 6px;
  }

  /* ── CONTENT AREA ── */
  .content-area {
    position: relative;
    z-index: 10;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: -8px;
  }

  /* ── GLASS CARDS ── */
  .glass-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }

  .glass-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  }

  .glass-card--accent {
    border-color: rgba(255,107,157,0.3);
    background: rgba(255,107,157,0.08);
  }

  .card-label {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .label-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .label-dot--pink { background: var(--accent-pink); }
  .label-dot--cyan { background: var(--accent-cyan); }
  .label-dot--yellow { background: var(--accent-yellow); }
  .label-dot--purple { background: var(--accent-purple); }

  .card-text {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.88rem;
    line-height: 1.65;
    color: var(--text-secondary);
    font-weight: 300;
  }

  .card-text--large {
    font-family: 'Sora', sans-serif;
    font-size: 1rem;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.7;
  }

  /* ── MOOD PILL ── */
  .mood-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,107,157,0.15);
    border: 1px solid rgba(255,107,157,0.3);
    border-radius: 20px;
    padding: 5px 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--accent-pink);
  }

  .mood-pill-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-pink);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ── COMPLAINTS CHIPS ── */
  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }

  .chip {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 5px 12px;
    line-height: 1.3;
  }

  /* ── WISH HIGHLIGHT ── */
  .wish-highlight {
    background: linear-gradient(135deg, rgba(167,139,250,0.12), rgba(78,205,196,0.08));
    border-color: rgba(167,139,250,0.25);
  }

  /* ── FLOATING ELEMENTS ── */
  .floating {
    position: absolute;
    z-index: 5;
    pointer-events: none;
  }

  .float-circle-1 {
    top: 35%;
    right: -20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.08);
    animation: floatUp 8s ease-in-out infinite;
  }

  .float-circle-2 {
    top: 55%;
    left: -15px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(78,205,196,0.06);
    animation: floatUp 10s ease-in-out infinite reverse;
  }

  @keyframes floatUp {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-16px); }
  }

  /* ── SHARE FOOTER ── */
  .share-footer {
    position: relative;
    z-index: 10;
    padding: 10px 16px 20px;
  }

  .share-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .share-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.7rem;
    color: var(--text-muted);
  }

  .share-text-bottom {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.7rem;
    font-style: italic;
    color: var(--text-muted);
    line-height: 1.4;
    margin-top: 6px;
    opacity: 0.6;
  }

  /* ── HOME INDICATOR ── */
  .home-indicator {
    position: relative;
    z-index: 20;
    width: 134px;
    height: 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    margin: 8px auto 12px;
  }

  /* ── SCENE TEXT OVERLAY ── */
  .scene-overlay {
    position: absolute;
    bottom: 60px;
    left: 20px;
    right: 60px;
    z-index: 15;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.75rem;
    font-style: italic;
    color: rgba(255,255,255,0.5);
    line-height: 1.5;
  }

  @media (max-width: 420px) {
    .phone {
      width: 100%;
      border-radius: 28px;
    }
    .subject-label { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<!-- Language Toggle -->
<div style="position:fixed;top:12px;right:16px;z-index:9999;display:flex;gap:4px;">
  <button class="lang-btn" onclick="setLang('zh')" style="font-family:'Plus Jakarta Sans',sans-serif;font-size:0.7rem;padding:4px 10px;border-radius:14px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.15);color:#fff;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all 0.2s;">中文</button>
  <button class="lang-btn" onclick="setLang('en')" style="font-family:'Plus Jakarta Sans',sans-serif;font-size:0.7rem;padding:4px 10px;border-radius:14px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all 0.2s;">EN</button>
</div>

<div class="phone">

  <!-- ANIMATED GRADIENT BACKGROUND -->
  <div class="gradient-bg"></div>

  <!-- FLOATING ELEMENTS -->
  <div class="floating float-circle-1"></div>
  <div class="floating float-circle-2"></div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <span class="status-time">21:37</span>
    <div class="status-icons">
      <!-- Signal bars SVG -->
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="8" width="3" height="4" rx="0.5" fill="white"/>
        <rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="white"/>
        <rect x="9" y="2" width="3" height="10" rx="0.5" fill="white"/>
        <rect x="13" y="0" width="3" height="12" rx="0.5" fill="white" opacity="0.3"/>
      </svg>
      <!-- WiFi SVG -->
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 10.5a1 1 0 100 2 1 1 0 000-2z" fill="white"/>

        <path d="M2 5.5a8 8 0 0112 0" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </svg>
      <!-- Battery SVG -->
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="22" height="11" rx="2" stroke="white" stroke-width="1" fill="none" opacity="0.4"/>
        <rect x="2" y="2" width="14" height="8" rx="1" fill="white"/>
        <rect x="23.5" y="3.5" width="2" height="5" rx="1" fill="white" opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- DYNAMIC ISLAND -->
  <div class="dynamic-island"></div>

  <!-- PHOTO HERO -->
  <div class="photo-hero">
    <div class="photo-placeholder">
      <img id="subject-photo" class="subject-photo" src="" alt="Subject" style="width:100%;height:100%;object-fit:cover">
    </div>
    <!-- Name overlay -->
    <div class="subject-name-overlay">
      <div class="subject-label" id="subject-label"></div>
      <div class="subject-type-tag" id="subject-type-tag">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1" fill="none"/>
          <circle cx="5" cy="5" r="1.5" fill="currentColor"/>
        </svg>
        <span id="subject-type-text"></span>
      </div>
    </div>
    <div class="scene-overlay" id="scene-overlay"></div>
  </div>

  <!-- CONTENT CARDS -->
  <div class="content-area">

    <!-- MOOD -->
    <div style="padding:4px 0;">
      <div class="mood-pill">
        <span class="mood-pill-dot"></span>
        <span id="mood-text"></span>
      </div>
    </div>

    <!-- MONOLOGUE -->
    <div class="glass-card glass-card--accent">
      <div class="card-label">
        <span class="label-dot label-dot--pink"></span>
        Inner Voice
      </div>
      <p class="card-text card-text--large" id="monologue-text"></p>
    </div>

    <!-- COMPLAINTS -->
    <div class="glass-card">
      <div class="card-label">
        <span class="label-dot label-dot--cyan"></span>
        Grievances
      </div>
      <div class="chips-row" id="complaints-chips"></div>
    </div>

    <!-- MESSAGE -->
    <div class="glass-card">
      <div class="card-label">
        <span class="label-dot label-dot--yellow"></span>
        Message to Owner
      </div>
      <p class="card-text" id="message-text"></p>
    </div>

    <!-- WISH -->
    <div class="glass-card wish-highlight">
      <div class="card-label">
        <span class="label-dot label-dot--purple"></span>
        Deepest Wish
      </div>
      <p class="card-text" id="wish-text"></p>
    </div>

  </div>

  <!-- SHARE FOOTER -->
  <div class="share-footer">
    <div class="share-row">
      <span class="share-btn" style="cursor:pointer" onclick="copyShare()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 1v8M4 4l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 9v3a1 1 0 001 1h8a1 1 0 001-1V9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Share
      </span>
      <span class="share-btn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2" fill="none"/>
          <path d="M4 7h6M7 4v6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Save
      </span>
      <span class="share-btn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="3" cy="7" r="2" stroke="currentColor" stroke-width="1.2" fill="none"/>
          <circle cx="11" cy="3" r="2" stroke="currentColor" stroke-width="1.2" fill="none"/>
          <circle cx="11" cy="11" r="2" stroke="currentColor" stroke-width="1.2" fill="none"/>
          <line x1="5" y1="6" x2="9" y2="4" stroke="currentColor" stroke-width="1"/>
          <line x1="5" y1="8" x2="9" y2="10" stroke="currentColor" stroke-width="1"/>
        </svg>
        Send
      </span>
    </div>
    <p class="share-text-bottom" id="share-text"></p>
  </div>

  <!-- HOME INDICATOR -->
  <div class="home-indicator"></div>

</div>

<script>
const DATA = {

  "internalNarrative": {
    "zh": "\u6211\u77e5\u9053\u4f60\u770b\u5230\u4e86\u3002\u9019\u9762\u91d1\u724c\u3002\u6211\u7279\u5730\u628a\u5b83\u8209\u5230\u4e00\u500b\u4f60\u4e0d\u53ef\u80fd\u5ffd\u7565\u7684\u89d2\u5ea6\u3002\u7a97\u5916\u7684\u96ea\u666f\u662f\u514d\u8cbb\u9644\u8d08\u7684\u610f\u5883\u52a0\u6210\u3002\u6211\u7684\u7b11\u5bb9\u7d93\u904e\u7cbe\u5bc6\u8a08\u7b97\uff0c\u6070\u597d\u5728\u300c\u8b19\u905c\u300d\u8207\u300c\u4f60\u770b\u5230\u4e86\u55ce\u300d\u4e4b\u9593\u53d6\u5f97\u5b8c\u7f8e\u5e73\u8861\u3002\u9019\u5f35\u7167\u7247\u5c07\u4f5c\u70ba\u672a\u4f86\u4e09\u5e74\u6240\u6709\u793e\u4ea4\u5e73\u53f0\u5927\u982d\u8cbc\u7684\u5019\u9078\u7d20\u6750\u3002",

  "concerns": {

const IMAGE = "goodispeter.png";

let currentLang = "zh";

function t(field) {
  if (!DATA[field]) return "";
  return DATA[field][currentLang] || DATA[field]["zh"] || "";
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll(".lang-btn").forEach(function(b) {
    b.classList.remove("active");
    b.style.background = "rgba(255,255,255,0.05)";
    b.style.color = "rgba(255,255,255,0.6)";
  });
  var active = document.querySelector('.lang-btn[onclick="setLang(\'' + lang + '\')"]');
  if (active) {
    active.classList.add("active");
    active.style.background = "rgba(255,255,255,0.15)";
    active.style.color = "#fff";
  }
  render();
}

function render() {
  document.getElementById("subject-photo").src = IMAGE;
  document.getElementById("subject-label").textContent = t("subjectName");
  document.getElementById("subject-type-text").textContent = t("subjectType") + " " + (DATA.subjectType ? (DATA.subjectType[currentLang === "zh" ? "en" : "zh"] || "") : "") + " \u00B7 " + t("style");
  document.getElementById("scene-overlay").textContent = t("sceneDescription");
  document.getElementById("mood-text").textContent = t("detectedMood");
  document.getElementById("monologue-text").textContent = t("internalNarrative");

  var chipsContainer = document.getElementById("complaints-chips");
  chipsContainer.innerHTML = "";
  var complaints = DATA.concerns ? (DATA.concerns[currentLang] || DATA.concerns["zh"] || []) : [];
  complaints.forEach(function(c) {
    var span = document.createElement("span");
    span.className = "chip";
    span.textContent = c;
    chipsContainer.appendChild(span);
  });

  document.getElementById("message-text").textContent = t("messageToCaretaker");
  document.getElementById("wish-text").textContent = t("requestedAdjustment");
  document.getElementById("share-text").textContent = t("shareText");

  document.title = "SNS Story \u2014 " + t("subjectName");
}

function copyShare() {
  var text = t("shareText");
  if (navigator.clipboard && text) {
    navigator.clipboard.writeText(text).then(function() {
      var btn = document.querySelector('.share-btn[onclick="copyShare()"]');
      var orig = btn.innerHTML;
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7l3 3 5-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Copied!';
      setTimeout(function() { btn.innerHTML = orig; }, 1500);
    });
  }
}

render();
</script>
