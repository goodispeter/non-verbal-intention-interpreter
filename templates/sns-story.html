<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNS Story</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --glass-bg: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.12);
    --glass-strong: rgba(255,255,255,0.14);
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.8);
    --text-muted: rgba(255,255,255,0.5);
    --accent-pink: #ff6b9d;
    --accent-cyan: #4ecdc4;
    --accent-yellow: #ffe66d;
    --accent-purple: #a78bfa;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ── ANIMATED MESH GRADIENT BG ── */
  .bg-gradient {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, #ff6b9d 0%, transparent 50%),
      radial-gradient(circle at 80% 30%, #4ecdc4 0%, transparent 45%),
      radial-gradient(circle at 40% 70%, #a78bfa 0%, transparent 50%),
      radial-gradient(circle at 75% 80%, #ffe66d 0%, transparent 40%),
      linear-gradient(135deg, #1a0533 0%, #0d1b2a 30%, #1b2838 60%, #16213e 100%);
    background-size: 200% 200%;
    animation: meshMove 12s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes meshMove {
    0% { background-position: 0% 0%; }
    25% { background-position: 50% 25%; }
    50% { background-position: 100% 50%; }
    75% { background-position: 50% 75%; }
    100% { background-position: 0% 0%; }
  }
  .bg-gradient::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  /* ── LANG TOGGLE ── */
  .lang-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    gap: 4px;
  }
  .lang-btn {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  .lang-btn.active {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
  }

  /* ── LAYOUT ── */
  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: 60px 20px 40px;
  }

  /* ── HERO PHOTO ── */
  .hero {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 24px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60%;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 40%, transparent 100%);
    pointer-events: none;
  }
  .hero-overlay {
    position: absolute;
    bottom: 20px;
    left: 24px;
    right: 24px;
    z-index: 5;
  }
  .hero-name {
    font-family: 'Sora', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    text-shadow: 0 2px 16px rgba(0,0,0,0.5);
    margin-bottom: 8px;
  }
  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-secondary);
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 5px 12px;
    border-radius: 20px;
  }
  .hero-tag svg { flex-shrink: 0; }

  /* ── MOOD PILL ── */
  .mood-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,107,157,0.12);
    border: 1px solid rgba(255,107,157,0.25);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--accent-pink);
    margin-bottom: 16px;
  }
  .mood-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent-pink);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ── GLASS CARDS ── */
  .card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  }
  .card--accent {
    border-color: rgba(255,107,157,0.2);
    background: rgba(255,107,157,0.06);
  }
  .card--wish {
    background: linear-gradient(135deg, rgba(167,139,250,0.1), rgba(78,205,196,0.06));
    border-color: rgba(167,139,250,0.2);
  }

  .card-label {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot--pink { background: var(--accent-pink); }
  .dot--cyan { background: var(--accent-cyan); }
  .dot--yellow { background: var(--accent-yellow); }
  .dot--purple { background: var(--accent-purple); }

  .card-text {
    font-size: 0.92rem;
    line-height: 1.7;
    color: var(--text-secondary);
    font-weight: 300;
  }
  .card-text--large {
    font-family: 'Sora', sans-serif;
    font-size: 1rem;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.75;
  }

  /* ── CHIPS ── */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    font-size: 0.78rem;
    font-weight: 400;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 6px 14px;
    line-height: 1.4;
  }

  /* ── SHARE FOOTER ── */
  .share-footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .share-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.75rem;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.2s;
    background: none;
    border: none;
    font-family: inherit;
  }
  .share-btn:hover { color: #fff; }
  .share-quote {
    font-size: 0.78rem;
    font-style: italic;
    color: var(--text-muted);
    line-height: 1.5;
    margin-top: 12px;
    opacity: 0.6;
  }

  @media (max-width: 500px) {
    .hero { aspect-ratio: 1; border-radius: 16px; }
    .hero-name { font-size: 1.2rem; }
    .page { padding: 50px 12px 30px; }
  }
</style>
</head>
<body>

<div class="bg-gradient"></div>

<div class="lang-toggle">
  <button class="lang-btn active" onclick="setLang('zh')">中文</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>
</div>

<div class="page">

  <!-- Hero -->
  <div class="hero">
    <img id="subject-photo" src="" alt="Subject">
    <div class="hero-overlay">
      <div class="hero-name" id="subject-label"></div>
      <div class="hero-tag" id="subject-type-tag">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="5" cy="5" r="1.5" fill="currentColor"/></svg>
        <span id="subject-type-text"></span>
      </div>
    </div>
  </div>

  <!-- Mood -->
  <div class="mood-pill">
    <span class="mood-dot"></span>
    <span id="mood-text"></span>
  </div>

  <!-- Monologue -->
  <div class="card card--accent">
    <div class="card-label"><span class="dot dot--pink"></span> Inner Voice</div>
    <p class="card-text card-text--large" id="monologue-text"></p>
  </div>

  <!-- Complaints -->
  <div class="card">
    <div class="card-label"><span class="dot dot--cyan"></span> Grievances</div>
    <div class="chips" id="complaints-chips"></div>
  </div>

  <!-- Message -->
  <div class="card">
    <div class="card-label"><span class="dot dot--yellow"></span> Message to Owner</div>
    <p class="card-text" id="message-text"></p>
  </div>

  <!-- Wish -->
  <div class="card card--wish">
    <div class="card-label"><span class="dot dot--purple"></span> Deepest Wish</div>
    <p class="card-text" id="wish-text"></p>
  </div>

  <!-- Share -->
  <div class="share-footer">
    <button class="share-btn" onclick="copyShare()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4 4l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 9v3a1 1 0 001 1h8a1 1 0 001-1V9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span id="share-btn-label">Share</span>
    </button>
  </div>
  <p class="share-quote" id="share-text"></p>

</div>

<script>
const DATA = JSON.parse('__REPORT_DATA_JSON__');
const IMAGE = "__SUBJECT_IMAGE__";

let currentLang = "zh";

function t(field) {
  if (!DATA[field]) return "";
  return DATA[field][currentLang] || DATA[field]["zh"] || "";
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll(".lang-btn").forEach(function(b) {
    b.classList.remove("active");
    b.style.background = "rgba(255,255,255,0.05)";
    b.style.color = "rgba(255,255,255,0.5)";
  });
  var active = document.querySelector('.lang-btn[onclick="setLang(\'' + lang + '\')"]');
  if (active) {
    active.classList.add("active");
    active.style.background = "rgba(255,255,255,0.15)";
    active.style.color = "#fff";
  }
  render();
}

function render() {
  document.getElementById("subject-photo").src = IMAGE;
  document.getElementById("subject-label").textContent = t("subjectName");
  document.getElementById("subject-type-text").textContent = t("subjectType") + " \u00B7 " + t("style");
  document.getElementById("mood-text").textContent = t("detectedMood");
  document.getElementById("monologue-text").textContent = t("internalNarrative");

  var chipsContainer = document.getElementById("complaints-chips");
  chipsContainer.innerHTML = "";
  var complaints = DATA.concerns ? (DATA.concerns[currentLang] || DATA.concerns["zh"] || []) : [];
  complaints.forEach(function(c) {
    var span = document.createElement("span");
    span.className = "chip";
    span.textContent = c;
    chipsContainer.appendChild(span);
  });

  document.getElementById("message-text").textContent = t("messageToCaretaker");
  document.getElementById("wish-text").textContent = t("requestedAdjustment");
  document.getElementById("share-text").textContent = t("shareText");

  document.title = "SNS Story \u2014 " + t("subjectName");
}

function copyShare() {
  var text = t("shareText");
  if (navigator.clipboard && text) {
    navigator.clipboard.writeText(text).then(function() {
      var el = document.getElementById("share-btn-label");
      el.textContent = "Copied!";
      setTimeout(function() { el.textContent = "Share"; }, 1500);
    });
  }
}

render();
</script>
</body>
</html>
