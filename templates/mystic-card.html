<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystic Card</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --navy: #0a0e27;
    --navy-mid: #111638;
    --navy-light: #1a2050;
    --gold: #c9a84c;
    --gold-light: #e8d48b;
    --gold-pale: #f5e6b8;
    --cream: #f0e6d3;
    --star: #fffbe6;
  }

  body {
    background: var(--navy);
    font-family: 'Crimson Pro', Georgia, serif;
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* ── STAR FIELD ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(1px 1px at 10% 20%, var(--star) 1px, transparent 0),
      radial-gradient(1.5px 1.5px at 25% 55%, var(--gold-light) 1px, transparent 0),
      radial-gradient(1px 1px at 40% 10%, var(--star) 1px, transparent 0),
      radial-gradient(1.2px 1.2px at 55% 75%, var(--gold-pale) 1px, transparent 0),
      radial-gradient(1px 1px at 70% 30%, var(--star) 1px, transparent 0),
      radial-gradient(1.5px 1.5px at 85% 60%, var(--gold-light) 1px, transparent 0),
      radial-gradient(1px 1px at 15% 80%, var(--star) 1px, transparent 0),
      radial-gradient(1.2px 1.2px at 60% 45%, var(--gold-pale) 1px, transparent 0),
      radial-gradient(1px 1px at 90% 15%, var(--star) 1px, transparent 0),
      radial-gradient(1.5px 1.5px at 35% 90%, var(--gold-light) 1px, transparent 0),
      radial-gradient(0.8px 0.8px at 5% 50%, var(--star) 0.8px, transparent 0),
      radial-gradient(0.8px 0.8px at 48% 25%, var(--star) 0.8px, transparent 0),
      radial-gradient(0.8px 0.8px at 72% 68%, var(--star) 0.8px, transparent 0),
      radial-gradient(0.8px 0.8px at 95% 85%, var(--star) 0.8px, transparent 0),
      radial-gradient(0.8px 0.8px at 20% 42%, var(--star) 0.8px, transparent 0),
      radial-gradient(2px 2px at 50% 50%, rgba(201,168,76,0.15) 2px, transparent 0);
    pointer-events: none;
    z-index: 0;
    animation: twinkle 6s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.6; }
    50% { opacity: 1; }
    100% { opacity: 0.7; }
  }

  /* ── GRAIN OVERLAY ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
  }

  /* ── LANG TOGGLE ── */
  .lang-toggle {
    position: relative;
    z-index: 10;
    align-self: flex-end;
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
  }
  .lang-btn {
    font-family: 'Crimson Pro', serif;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    color: var(--gold);
    background: transparent;
    border: 1px solid var(--gold);
    padding: 3px 12px;
    cursor: pointer;
    transition: all 0.3s;
    opacity: 0.5;
  }
  .lang-btn.active {
    opacity: 1;
    background: rgba(201,168,76,0.15);
  }
  .lang-btn:hover { opacity: 0.85; }

  /* ── TAROT CARD ── */
  .tarot-card {
    position: relative;
    z-index: 5;
    width: 480px;
    max-width: 96vw;
    background: linear-gradient(170deg, var(--navy-mid) 0%, var(--navy) 40%, #0d1230 100%);
    border: 2px solid var(--gold);
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow:
      0 0 0 1px var(--navy),
      0 0 0 4px var(--gold),
      0 0 0 5px var(--navy),
      0 0 60px rgba(201,168,76,0.1),
      0 30px 80px rgba(0,0,0,0.6);
  }

  .card-border-top, .card-border-bottom {
    width: 100%;
    display: block;
    flex-shrink: 0;
  }

  /* ── HEADER ── */
  .card-header {
    width: 100%;
    text-align: center;
    padding: 32px 28px 12px;
    position: relative;
  }

  .card-numeral {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.8rem;
    letter-spacing: 0.5em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.7;
  }

  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3rem;
    font-weight: 700;
    background: linear-gradient(
      135deg,
      var(--gold) 0%,
      var(--gold-pale) 25%,
      #fff8e1 40%,
      var(--gold) 55%,
      var(--gold-light) 70%,
      var(--gold) 100%
    );
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: foilShimmer 5s ease-in-out infinite;
    margin: 4px 0;
    line-height: 1.15;
  }

  @keyframes foilShimmer {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-style: italic;
    color: var(--gold-light);
    opacity: 0.85;
    letter-spacing: 0.12em;
    font-weight: 400;
  }

  /* ── PHOTO ── */
  .photo-section {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 24px 0 16px;
    position: relative;
  }

  .photo-frame {
    position: relative;
    width: 320px;
    height: 320px;
  }

  .photo-placeholder {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 35%, rgba(201,168,76,0.08) 0%, transparent 50%),
      radial-gradient(circle at 60% 60%, var(--navy-light) 0%, var(--navy) 80%);
    border: 2.5px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    color: var(--gold);
    letter-spacing: 0.2em;
    position: absolute;
    top: 10px;
    left: 10px;
    overflow: hidden;
    box-shadow:
      0 0 0 8px var(--navy),
      0 0 0 10px rgba(201,168,76,0.25),
      inset 0 0 60px rgba(201,168,76,0.04);
  }

  .photo-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .photo-placeholder::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0%, rgba(201,168,76,0.25) 8%, transparent 16%, transparent 50%, rgba(201,168,76,0.2) 58%, transparent 66%);
    animation: orbitalGlow 10s linear infinite;
  }

  @keyframes orbitalGlow {
    to { transform: rotate(360deg); }
  }

  .ornate-ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 320px;
    height: 320px;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 80%;
    margin: 4px auto;
    display: block;
  }

  /* ── CONTENT ── */
  .card-body {
    width: 100%;
    padding: 4px 36px 12px;
  }

  .section {
    margin-bottom: 20px;
    text-align: center;
  }

  .section-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.72rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .section-label::before,
  .section-label::after {
    content: '';
    width: 24px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
  }

  .section-text {
    font-family: 'Crimson Pro', serif;
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--cream);
    font-weight: 300;
  }

  /* ── MOOD TAG ── */
  .mood-tag {
    display: inline-block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    color: var(--navy);
    background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
    padding: 5px 18px;
    margin: 10px 0 6px;
    font-weight: 600;
  }

  .scene-text {
    font-family: 'Crimson Pro', serif;
    font-size: 0.88rem;
    font-style: italic;
    line-height: 1.65;
    color: rgba(240,230,211,0.55);
    margin-top: 6px;
    padding: 0 12px;
  }

  /* ── MONOLOGUE ── */
  .monologue-text {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-size: 1.12rem;
    line-height: 1.85;
    color: var(--gold-pale);
    position: relative;
    padding: 16px 20px 8px;
    text-align: left;
  }

  .monologue-text::before {
    content: '\201C';
    font-family: 'Cormorant Garamond', serif;
    font-size: 4.5rem;
    color: var(--gold);
    opacity: 0.25;
    position: absolute;
    top: -14px;
    left: 0;
    line-height: 1;
  }

  .monologue-text::after {
    content: '\201D';
    font-family: 'Cormorant Garamond', serif;
    font-size: 4.5rem;
    color: var(--gold);
    opacity: 0.25;
    position: absolute;
    bottom: -30px;
    right: 4px;
    line-height: 1;
  }

  /* ── COMPLAINTS ── */
  .complaints {
    list-style: none;
    padding: 0;
    text-align: left;
  }

  .complaints li {
    font-family: 'Crimson Pro', serif;
    font-size: 0.95rem;
    line-height: 1.65;
    color: var(--cream);
    padding: 5px 0 5px 24px;
    position: relative;
    font-weight: 300;
  }

  .complaints li::before {
    content: '\25C6';
    color: var(--gold);
    position: absolute;
    left: 2px;
    top: 5px;
    font-size: 0.6rem;
  }

  /* ── MESSAGE ── */
  .message-section {
    margin-top: 8px;
    padding: 16px 20px;
    border-left: 2px solid var(--gold);
    text-align: left;
    background: linear-gradient(90deg, rgba(201,168,76,0.04), transparent 80%);
  }

  /* ── WISH BOX ── */
  .wish-box {
    border: 1px solid rgba(201,168,76,0.2);
    padding: 18px 22px;
    margin-top: 8px;
    position: relative;
    background: rgba(201,168,76,0.02);
    text-align: left;
  }

  .wish-box::before, .wish-box::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: var(--gold);
    border-style: solid;
    border-width: 0;
  }
  .wish-box::before {
    top: -1px; left: -1px;
    border-top-width: 2px; border-left-width: 2px;
  }
  .wish-box::after {
    bottom: -1px; right: -1px;
    border-bottom-width: 2px; border-right-width: 2px;
  }

  /* ── FOOTER ── */
  .card-footer {
    width: 100%;
    text-align: center;
    padding: 12px 28px 32px;
  }

  .share-text {
    font-family: 'Crimson Pro', serif;
    font-size: 0.82rem;
    font-style: italic;
    color: var(--gold-light);
    opacity: 0.5;
    line-height: 1.55;
    max-width: 380px;
    margin: 0 auto;
  }

  .footer-symbol {
    margin-top: 14px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    color: var(--gold);
    opacity: 0.35;
  }

  /* ── COPY BUTTON ── */
  .copy-btn {
    position: relative;
    z-index: 10;
    margin-top: 16px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    color: var(--gold);
    background: transparent;
    border: 1px solid var(--gold);
    padding: 8px 24px;
    cursor: pointer;
    transition: all 0.3s;
    opacity: 0.7;
  }
  .copy-btn:hover { opacity: 1; background: rgba(201,168,76,0.1); }

  /* ── DISCLAIMER ── */
  .disclaimer {
    position: relative;
    z-index: 10;
    margin-top: 16px;
    font-family: 'Crimson Pro', serif;
    font-size: 0.72rem;
    color: var(--gold);
    opacity: 0.3;
    text-align: center;
    max-width: 420px;
    line-height: 1.5;
  }

  @media (max-width: 520px) {
    .tarot-card { width: 100%; }
    .photo-placeholder { width: 240px; height: 240px; }
    .photo-frame { width: 260px; height: 260px; }
    .ornate-ring { width: 260px; height: 260px; }
    .card-title { font-size: 2.2rem; }
    .card-body { padding: 4px 20px 12px; }
  }
</style>
</head>
<body>

<!-- LANGUAGE TOGGLE -->
<div class="lang-toggle">
  <button class="lang-btn active" onclick="setLang('zh')">中文</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>
</div>

<div class="tarot-card">

  <!-- TOP ART DECO BORDER -->
  <svg class="card-border-top" viewBox="0 0 480 28" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="0" y1="2" x2="480" y2="2" stroke="#c9a84c" stroke-width="0.6"/>
    <line x1="0" y1="7" x2="480" y2="7" stroke="#c9a84c" stroke-width="0.3"/>
    <!-- Center chevron -->
    <polygon points="220,5 240,22 260,5" fill="none" stroke="#c9a84c" stroke-width="0.8"/>
    <line x1="232" y1="13" x2="248" y2="13" stroke="#c9a84c" stroke-width="0.5"/>
    <!-- Side diamonds -->
    <rect x="165" y="9" width="7" height="7" fill="none" stroke="#c9a84c" stroke-width="0.6" transform="rotate(45 168.5 12.5)"/>
    <rect x="308" y="9" width="7" height="7" fill="none" stroke="#c9a84c" stroke-width="0.6" transform="rotate(45 311.5 12.5)"/>
    <!-- Horizontal lines -->
    <line x1="24" y1="13" x2="160" y2="13" stroke="#c9a84c" stroke-width="0.3"/>
    <line x1="320" y1="13" x2="456" y2="13" stroke="#c9a84c" stroke-width="0.3"/>
    <!-- End diamonds -->
    <rect x="10" y="9" width="6" height="6" fill="#c9a84c" opacity="0.3" transform="rotate(45 13 12)"/>
    <rect x="464" y="9" width="6" height="6" fill="#c9a84c" opacity="0.3" transform="rotate(45 467 12)"/>
    <line x1="0" y1="26" x2="480" y2="26" stroke="#c9a84c" stroke-width="0.6"/>
  </svg>

  <div style="position:relative;width:100%;">

    <!-- HEADER -->
    <div class="card-header">
      <div class="card-numeral" id="el-numeral"></div>
      <h1 class="card-title" id="el-title"></h1>
      <div class="card-subtitle" id="el-subtitle"></div>
      <div class="mood-tag" id="el-mood"></div>
      <p class="scene-text" id="el-scene"></p>
    </div>

    <!-- PHOTO -->
    <div class="photo-section">
      <div class="photo-frame">
        <svg class="ornate-ring" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer dashed orbit -->
          <circle cx="160" cy="160" r="158" stroke="#c9a84c" stroke-width="0.4" stroke-dasharray="3 9"/>
          <!-- Inner orbit -->
          <circle cx="160" cy="160" r="152" stroke="#c9a84c" stroke-width="0.3"/>
          <!-- Cardinal point triangles -->
          <g stroke="#c9a84c" stroke-width="0.9" fill="none">
            <polygon points="160,6 164,18 156,18"/>
            <polygon points="160,314 164,302 156,302"/>
            <polygon points="6,160 18,156 18,164"/>
            <polygon points="314,160 302,156 302,164"/>
          </g>
          <!-- Diagonal dots -->
          <circle cx="46" cy="46" r="2" fill="#c9a84c" opacity="0.4"/>
          <circle cx="274" cy="46" r="2" fill="#c9a84c" opacity="0.4"/>
          <circle cx="46" cy="274" r="2" fill="#c9a84c" opacity="0.4"/>
          <circle cx="274" cy="274" r="2" fill="#c9a84c" opacity="0.4"/>
          <!-- Decorative arcs -->
          <path d="M 70 28 A 150 150 0 0 1 250 28" stroke="#c9a84c" stroke-width="0.3" fill="none"/>
          <path d="M 70 292 A 150 150 0 0 0 250 292" stroke="#c9a84c" stroke-width="0.3" fill="none"/>
          <path d="M 28 70 A 150 150 0 0 0 28 250" stroke="#c9a84c" stroke-width="0.3" fill="none"/>
          <path d="M 292 70 A 150 150 0 0 1 292 250" stroke="#c9a84c" stroke-width="0.3" fill="none"/>
        </svg>
        <div class="photo-placeholder" id="el-photo"></div>
      </div>
    </div>

    <!-- DIVIDER -->
    <svg class="divider" viewBox="0 0 380 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="9" x2="155" y2="9" stroke="#c9a84c" stroke-width="0.4"/>
      <line x1="225" y1="9" x2="380" y2="9" stroke="#c9a84c" stroke-width="0.4"/>
      <polygon points="182,2 190,9 182,16 174,9" fill="none" stroke="#c9a84c" stroke-width="0.7"/>
      <polygon points="198,2 206,9 198,16 190,9" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.5"/>
      <circle cx="160" cy="9" r="1.8" fill="#c9a84c" opacity="0.4"/>
      <circle cx="220" cy="9" r="1.8" fill="#c9a84c" opacity="0.4"/>
    </svg>

    <!-- BODY -->
    <div class="card-body">

      <!-- MONOLOGUE -->
      <div class="section">
        <div class="section-label" id="el-label-monologue"></div>
        <div class="monologue-text" id="el-monologue"></div>
      </div>

      <!-- COMPLAINTS -->
      <div class="section" style="text-align:left;">
        <div class="section-label" id="el-label-complaints"></div>
        <ul class="complaints" id="el-complaints"></ul>
      </div>

      <!-- MESSAGE -->
      <div class="section">
        <div class="section-label" id="el-label-message"></div>
        <div class="message-section">
          <p class="section-text" id="el-message"></p>
        </div>
      </div>

      <!-- WISH -->
      <div class="section">
        <div class="section-label" id="el-label-wish"></div>
        <div class="wish-box">
          <p class="section-text" id="el-wish"></p>
        </div>
      </div>

    </div>

    <!-- DIVIDER -->
    <svg class="divider" viewBox="0 0 380 14" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="7" x2="165" y2="7" stroke="#c9a84c" stroke-width="0.4"/>
      <line x1="215" y1="7" x2="380" y2="7" stroke="#c9a84c" stroke-width="0.4"/>
      <circle cx="190" cy="7" r="4" fill="none" stroke="#c9a84c" stroke-width="0.7"/>
      <circle cx="190" cy="7" r="1.5" fill="#c9a84c" opacity="0.5"/>
    </svg>

    <!-- FOOTER -->
    <div class="card-footer">
      <p class="share-text" id="el-share"></p>
      <div class="footer-symbol">&#10038;</div>
    </div>

  </div>

  <!-- BOTTOM ART DECO BORDER -->
  <svg class="card-border-bottom" viewBox="0 0 480 28" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="0" y1="2" x2="480" y2="2" stroke="#c9a84c" stroke-width="0.6"/>
    <polygon points="220,23 240,6 260,23" fill="none" stroke="#c9a84c" stroke-width="0.8"/>
    <line x1="232" y1="15" x2="248" y2="15" stroke="#c9a84c" stroke-width="0.5"/>
    <rect x="165" y="12" width="7" height="7" fill="none" stroke="#c9a84c" stroke-width="0.6" transform="rotate(45 168.5 15.5)"/>
    <rect x="308" y="12" width="7" height="7" fill="none" stroke="#c9a84c" stroke-width="0.6" transform="rotate(45 311.5 15.5)"/>
    <line x1="24" y1="15" x2="160" y2="15" stroke="#c9a84c" stroke-width="0.3"/>
    <line x1="320" y1="15" x2="456" y2="15" stroke="#c9a84c" stroke-width="0.3"/>
    <rect x="10" y="12" width="6" height="6" fill="#c9a84c" opacity="0.3" transform="rotate(45 13 15)"/>
    <rect x="464" y="12" width="6" height="6" fill="#c9a84c" opacity="0.3" transform="rotate(45 467 15)"/>
    <line x1="0" y1="21" x2="480" y2="21" stroke="#c9a84c" stroke-width="0.3"/>
    <line x1="0" y1="26" x2="480" y2="26" stroke="#c9a84c" stroke-width="0.6"/>
  </svg>

</div>

<!-- COPY BUTTON -->
<button class="copy-btn" id="el-copy-btn" onclick="copyShare()"></button>

<!-- DISCLAIMER -->
<p class="disclaimer" id="el-disclaimer"></p>

<script>
const DATA = JSON.parse('__REPORT_DATA_JSON__');
const IMAGE = "__SUBJECT_IMAGE__";
let currentLang = "zh";

const UI = {
  zh: {
    numeral: function(s) { return "\u2726 " + s + " \u2726"; },
    subtitle: function(s) { return "\u2014 " + s + " \u2014"; },
    mood: function(s) { return "\u2666 " + s + " \u2666"; },
    labelMonologue: "Inner Voice",
    labelComplaints: "Grievances",
    labelMessage: "Message to Owner",
    labelWish: "Deepest Wish",
    copyBtn: "\u2727 \u8907\u88FD\u5206\u4EAB\u6587\u5B57 \u2727",
    copyDone: "\u2713 \u5DF2\u8907\u88FD",
    disclaimer: "\u2728 \u6B64\u5831\u544A\u7531 AI \u975E\u8A9E\u8A00\u89E3\u8B80\u7CFB\u7D71\u751F\u6210\uFF0C\u50C5\u4F9B\u5A1B\u6A02\u7528\u9014\uFF0C\u4E0D\u69CB\u6210\u5C08\u696D\u5EFA\u8B70\u3002"
  },
  en: {
    numeral: function(s) { return "\u2726 " + s + " \u2726"; },
    subtitle: function(s) { return "\u2014 " + s + " \u2014"; },
    mood: function(s) { return "\u2666 " + s + " \u2666"; },
    labelMonologue: "Inner Voice",
    labelComplaints: "Grievances",
    labelMessage: "Message to Owner",
    labelWish: "Deepest Wish",
    copyBtn: "\u2727 Copy Share Text \u2727",
    copyDone: "\u2713 Copied",
    disclaimer: "\u2728 This report is generated by an AI non-verbal interpretation system for entertainment purposes only. Not professional advice."
  }
};

function t(field) {
  if (!DATA[field]) return "";
  return DATA[field][currentLang] || DATA[field]["zh"] || "";
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll(".lang-btn").forEach(function(b) { b.classList.remove("active"); });
  document.querySelector('.lang-btn[onclick="setLang(\'' + lang + '\')"]').classList.add("active");
  render();
}

function render() {
  var ui = UI[currentLang];

  // Photo
  var photoEl = document.getElementById("el-photo");
  if (IMAGE && IMAGE !== "") {
    photoEl.innerHTML = '<img src="' + IMAGE + '" alt="subject photo">';
  }

  // Header
  document.getElementById("el-numeral").innerHTML = ui.numeral(t("subjectType"));
  document.getElementById("el-title").textContent = t("subjectName");
  document.getElementById("el-subtitle").innerHTML = ui.subtitle(t("style"));
  document.getElementById("el-mood").innerHTML = ui.mood(t("detectedMood"));
  document.getElementById("el-scene").textContent = t("sceneDescription");

  // Section labels
  document.getElementById("el-label-monologue").textContent = ui.labelMonologue;
  document.getElementById("el-label-complaints").textContent = ui.labelComplaints;
  document.getElementById("el-label-message").textContent = ui.labelMessage;
  document.getElementById("el-label-wish").textContent = ui.labelWish;

  // Content
  document.getElementById("el-monologue").textContent = t("internalNarrative");
  document.getElementById("el-message").textContent = t("messageToCaretaker");
  document.getElementById("el-wish").textContent = t("requestedAdjustment");

  // Complaints list
  var complaintsEl = document.getElementById("el-complaints");
  complaintsEl.innerHTML = "";
  var complaints = DATA["concerns"];
  if (complaints) {
    var items = complaints[currentLang] || complaints["zh"] || [];
    items.forEach(function(c) {
      var li = document.createElement("li");
      li.textContent = c;
      complaintsEl.appendChild(li);
    });
  }

  // Share text
  document.getElementById("el-share").textContent = t("shareText");

  // Copy button
  document.getElementById("el-copy-btn").textContent = ui.copyBtn;

  // Disclaimer
  document.getElementById("el-disclaimer").textContent = ui.disclaimer;
}

function copyShare() {
  var text = t("shareText");
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById("el-copy-btn");
    var ui = UI[currentLang];
    btn.textContent = ui.copyDone;
    setTimeout(function() { btn.textContent = ui.copyBtn; }, 2000);
  });
}

render();
</script>

</body>
</html>
